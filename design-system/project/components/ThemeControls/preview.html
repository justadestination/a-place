<!-- @dsCard group="Settings" height=472 subtitle="/embed/theme-controls/" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Display settings</title>
<style>body{margin:0;background:var(--nc-color-bg);color:var(--nc-color-text);font-family:var(--nc-font-family-sans)}</style>
</head>
<body>
<!-- Static render of the live component at /embed/theme-controls/ (captured from the real module; interactive version: the embed route). -->
<div class="nc-embed-root" style="padding:12px"><form class="nc-theme-controls" aria-label="Display settings"><fieldset class="nc-theme-controls__group"><legend class="nc-label">Theme</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="system" data-key="scheme"><span>Match device</span></label><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="light" data-key="scheme"><span>Light</span></label><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="dark" data-key="scheme"><span>Dark</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Text size</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1" data-key="textScale"><span>Default</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1.25" data-key="textScale"><span>Large</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1.5" data-key="textScale"><span>Larger</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="2" data-key="textScale"><span>Largest</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Spacing</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="density-1" value="compact" data-key="density"><span>Tight</span></label><label class="nc-segmented__option"><input type="radio" name="density-1" value="comfortable" data-key="density"><span>Normal</span></label><label class="nc-segmented__option"><input type="radio" name="density-1" value="spacious" data-key="density"><span>Roomy</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Motion</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="motion-1" value="system" data-key="motion"><span>Match device</span></label><label class="nc-segmented__option"><input type="radio" name="motion-1" value="reduce" data-key="motion"><span>Reduce</span></label><label class="nc-segmented__option"><input type="radio" name="motion-1" value="full" data-key="motion"><span>Allow</span></label></div></fieldset><div class="nc-theme-controls__footer"><button class="nc-button nc-button--ghost" type="button"><span>Reset</span></button></div></form></div>
</body>
</html>
