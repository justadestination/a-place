<head><meta charset="utf-8"><title>Site header</title>

<body>
<!-- Static render of the live component at /embed/site-header/ (captured from the real module; interactive version: the embed route). -->
<div class="nc-embed-root" style="padding:12px"><header class="nc-site-header"><div class="nc-container nc-site-header__inner"><a class="nc-wordmark" href="/"><span class="nc-wordmark__name">NightCal</span><span class="nc-wordmark__place">Downtown Santa Rosa</span></a><nav class="nc-site-header__nav" aria-label="Main"><ul role="list"><li><a href="/" aria-current="page">Calendar</a></li><li><a href="/zine/">Zine</a></li></ul></nav><div class="nc-site-header__tools"><button class="nc-button nc-button--ghost" type="button" aria-expanded="false" aria-controls="nc-display-panel"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><span>Display</span></button><div class="nc-site-header__panel" id="nc-display-panel" hidden=""><form class="nc-theme-controls" aria-label="Display settings"><fieldset class="nc-theme-controls__group"><legend class="nc-label">Theme</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="system" data-key="scheme"><span>Match device</span></label><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="light" data-key="scheme"><span>Light</span></label><label class="nc-segmented__option"><input type="radio" name="scheme-1" value="dark" data-key="scheme"><span>Dark</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Text size</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1" data-key="textScale"><span>Default</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1.25" data-key="textScale"><span>Large</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="1.5" data-key="textScale"><span>Larger</span></label><label class="nc-segmented__option"><input type="radio" name="textScale-1" value="2" data-key="textScale"><span>Largest</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Spacing</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="density-1" value="compact" data-key="density"><span>Tight</span></label><label class="nc-segmented__option"><input type="radio" name="density-1" value="comfortable" data-key="density"><span>Normal</span></label><label class="nc-segmented__option"><input type="radio" name="density-1" value="spacious" data-key="density"><span>Roomy</span></label></div></fieldset><fieldset class="nc-theme-controls__group"><legend class="nc-label">Motion</legend><div class="nc-segmented__options"><label class="nc-segmented__option"><input type="radio" name="motion-1" value="system" data-key="motion"><span>Match device</span></label><label class="nc-segmented__option"><input type="radio" name="motion-1" value="reduce" data-key="motion"><span>Reduce</span></label><label class="nc-segmented__option"><input type="radio" name="motion-1" value="full" data-key="motion"><span>Allow</span></label></div></fieldset><div class="nc-theme-controls__footer"><button class="nc-button nc-button--ghost" type="button"><span>Reset</span></button></div></form></div></div></div></header></div>
</body>
