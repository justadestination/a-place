<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venue Profile — NightCal</title>
<meta name="description" content="Dedicated venue profile with upcoming events, announcements, and contact information.">
<link rel="canonical" href="https://nightcal.example.org/venue/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>(function () {
  var d = document.documentElement, s = null, q = null;
  try { s = JSON.parse(localStorage.getItem("nightcal.theme.v1") || "null"); } catch (e) {}
  try { q = new URLSearchParams(location.search); } catch (e) {}
  if (q) {
    s = s || {};
    if (q.get("scheme")) s.scheme = q.get("scheme");
    if (q.get("textScale")) s.textScale = parseFloat(q.get("textScale"));
    if (q.get("density")) s.density = q.get("density");
  }
  if (!s) return;
  if (s.scheme === "light" || s.scheme === "dark") d.setAttribute("data-theme", s.scheme);
  if (s.textScale > 0) d.style.setProperty("--nc-text-scale", String(Math.min(2, Math.max(1, s.textScale))));
  if (typeof s.density === "number") d.style.setProperty("--nc-density", String(s.density));
  else if (s.density === "compact" || s.density === "spacious") d.setAttribute("data-density", s.density);
  if (s.motion === "reduce" || s.motion === "full") d.setAttribute("data-motion", s.motion);
  if (s.css) {
    var el = document.createElement("style");
    el.id = "nc-theme-overrides";
    el.textContent = s.css;
    document.head.appendChild(el);
  }
})();</script>
<link rel="stylesheet" href="/css/nightcal.css?v=476deafda8">
<link rel="modulepreload" href="/js/data/calendar.js">
<link rel="modulepreload" href="/js/data/venues.js">
<link rel="modulepreload" href="/components/venue-page/venue-page.js">
<link rel="modulepreload" href="/components/site-header/site-header.js">
<link rel="modulepreload" href="/components/site-footer/site-footer.js">

<script type="module">
import { h } from "/js/core/dom.js";
import { loadCalendar } from "/js/data/calendar.js";
import { getVenueById, normalizeVenue } from "/js/data/venues.js";
import { venuePageView } from "/components/venue-page/venue-page.js";
import { siteHeader } from "/components/site-header/site-header.js";
import { siteFooter } from "/components/site-footer/site-footer.js";

async function init() {
  const root = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  let venueId = params.get("id") || params.get("venue");
  
  const model = await loadCalendar();
  if (!venueId) {
    const withEvents = (model.venues || []).find(v => (model.events || []).some(e => e.venueId === v.id));
    venueId = withEvents ? withEvents.id : (model.venues[0]?.id || "ven_47b8847d9089d868");
  }
  let venue = getVenueById(model, venueId);
  
  if (!venue && (params.get("closed") === "1" || venueId === "v_closed_sample")) {
    venue = normalizeVenue({
      id: "v_closed_sample",
      name: "The Velvet Cellar (Closed)",
      status: "closed",
      closed: true,
      address: "700 Main Street, Santa Rosa",
      yelp: "https://www.yelp.com/biz/the-velvet-cellar",
    }, []);
  }

  if (venue) {
    document.title = `${venue.name} — NightCal`;
  }

  const headerEl = siteHeader({ current: "venue" });
  const venueEl = venuePageView({ venue });
  const footerEl = siteFooter({ attribution: model.notes?.attribution });

  root.replaceChildren(headerEl, venueEl, footerEl);
}

init().catch(err => {
  console.error(err);
  document.getElementById("app").innerHTML = '<p class="nc-container" role="alert">Unable to load venue profile.</p>';
});
</script>
</head>
<body class="nc-page">
<div id="app"></div>
<noscript><p class="nc-container nc-section">NightCal needs JavaScript turned on to show listings.</p></noscript>
</body>
</html>
