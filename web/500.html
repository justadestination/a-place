<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 — System Hiccup · NightCal</title>
  <link rel="stylesheet" href="/css/nightcal.css">
  <style>
    .nc-error-page {
      min-height: 80vh;
      display: grid;
      place-items: center;
      padding: var(--nc-space-6);
      text-align: center;
    }
    .nc-error-card {
      max-width: 36rem;
      padding: var(--nc-space-8);
      background: var(--nc-color-surface);
      border: var(--nc-size-border) solid var(--nc-color-border);
      border-radius: var(--nc-radius-xl);
      box-shadow: var(--nc-shadow-raised);
      display: grid;
      gap: var(--nc-space-4);
      justify-items: center;
    }
    .nc-error-card__code {
      font-size: var(--nc-font-size-display);
      font-weight: var(--nc-font-weight-black);
      color: var(--nc-color-accent-text);
      line-height: 1;
      margin: 0;
    }
    .nc-error-card__title {
      font-size: var(--nc-font-size-2xl);
      font-weight: var(--nc-font-weight-bold);
      margin: 0;
    }
    .nc-error-card__message {
      font-size: var(--nc-font-size-md);
      color: var(--nc-color-text-muted);
      margin: 0;
      line-height: var(--nc-font-line-height-normal);
    }
  </style>
</head>
<body class="nc-theme-dark">
  <main class="nc-error-page">
    <div class="nc-error-card">
      <p class="nc-error-card__code">500</p>
      <h1 class="nc-error-card__title">Temporary hitch</h1>
      <p class="nc-error-card__message">Something unexpected happened behind the scenes. The incident has been recorded. Try refreshing the calendar in a moment.</p>
      <a href="/" class="nc-button nc-button--primary">← Return to Calendar</a>
    </div>
  </main>
</body>
</html>
