<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtown Metropolis</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0a0a;
    --sheet: #f0efe8;
    --ink: #171717;
    --bulb: #FFC14D;
    --comedy: #c0392b;
    --quiet: #8a8f98;
    --quiet-on-night: #c8cdd4;
    --wire: #3EE0FF;
    --comedy-on-night: #f0a09a;
    --display: 'Geist', 'Inter', system-ui, sans-serif;
    --text: 'Geist', 'Inter', system-ui, sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--sheet);
    font-family: var(--text);
    font-size: 1.05rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    width: min(1100px, calc(100% - 1.5rem));
    margin: 0 auto;
    padding: 1.5rem 0 2rem;
  }

  .skip {
    position: absolute; left: 0.75rem; top: -3rem;
    background: var(--bulb); color: var(--ink);
    padding: 0.4rem 0.7rem; font-size: 0.9rem;
  }
  .skip:focus { top: 0.75rem; z-index: 5; }

  /* Layout */
  .a2ui-column { display: flex; flex-direction: column; gap: 1rem; }
  .a2ui-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }

  /* Marquee */
  .marquee { padding-top: 0.25rem; }
  .place { font-size: 0.85rem; color: var(--quiet-on-night); margin: 0 0 0.2rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .month {
    margin: 0; font-family: var(--display); font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1; letter-spacing: -0.03em;
    color: var(--sheet);
  }
  .count { margin: 0.2rem 0 0; color: var(--quiet-on-night); font-size: 0.9rem; }
  .status { margin: 0.15rem 0 0; color: var(--bulb); font-size: 0.85rem; }

  /* Buttons */
  button.ctrl, button.room, button.day, button.thumb {
    font: inherit; color: inherit; background: transparent; cursor: pointer; text-align: left;
    font-family: var(--text);
  }
  button.ctrl, button.room, button.thumb {
    border: 0; padding: 0;
  }
  button.ctrl {
    color: var(--sheet); border-bottom: 2px solid transparent; padding-bottom: 0.15rem;
    font-size: 0.95rem; font-weight: 500;
  }
  button.ctrl.is-primary { border-bottom-color: var(--bulb); }
  button.ctrl:hover { border-bottom-color: var(--sheet); }
  button.ctrl[aria-busy="true"] { opacity: 0.6; }

  /* Rail */
  .rail { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; padding: 0.15rem 0 0.3rem; }
  .contact { margin: 0.1rem 0 0; color: var(--quiet-on-night); font-size: 0.85rem; }
  .contact a { color: var(--sheet); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  button.room {
    color: var(--quiet-on-night); font-size: 0.9rem; padding: 0.2rem 0;
    border-bottom: 1px solid transparent;
  }
  button.room[data-music="true"] { color: var(--sheet); }
  button.room[data-music="true"]::before {
    content: ""; display: inline-block; width: 0.35rem; height: 0.35rem;
    margin-right: 0.3rem; background: var(--bulb); vertical-align: 0.05rem; border-radius: 50%;
  }
  button.room.is-on { color: var(--ink); background: var(--bulb); padding: 0.15rem 0.4rem; border-radius: 4px; }

  /* Calendar sheet */
  .board { perspective: 1400px; perspective-origin: 50% 28%; padding: 0.25rem 0 4rem; }
  .sheet {
    background: var(--sheet); color: var(--ink); border-radius: 10px;
    overflow: hidden;
  }
  .night-cal {
    --tilt: var(--tilt-pref, 18);
    --depth: var(--depth-pref, 12);
    --depth-used: min(var(--depth), calc(6 / max(0.2, sin(calc(var(--tilt) * 1deg)))));
    --focus: var(--focus-pref, 1.15);
    --open: min(2.0, calc(1 + (var(--focus) - 1) * 3.5));
    --day: 7rem;
    width: 100%; padding: 0.7rem 0.7rem 0.9rem;
    transform: rotateX(calc(var(--tilt) * 1deg));
    transform-origin: center 34%; transform-style: preserve-3d;
  }
  .night-cal.is-suspended { background: transparent; color: var(--sheet); }
  .night-cal.is-suspended .cells { align-items: stretch; }
  .night-cal.is-suspended .dow {
    border-bottom: 1px solid var(--wire);
    box-shadow: 0 1px 8px rgba(62, 224, 255, 0.25);
  }
  .night-cal.is-suspended .dow span { color: var(--wire); text-shadow: 0 0 6px rgba(62, 224, 255, 0.4); }
  .dow, .cells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .slot { position: relative; min-height: var(--day); }
  .slot.is-open { z-index: 5; }
  .dow span {
    padding: 0.12rem 0.3rem 0.35rem; color: var(--quiet); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .day {
    container-type: inline-size; height: var(--day); min-height: var(--day);
    padding: 0.25rem 0.3rem 0.3rem; border: 0; border-bottom: 2px solid transparent;
    display: block; width: 100%; appearance: none; color: var(--ink); text-align: left;
    overflow: visible; perspective: 900px; perspective-origin: 0 0;
    cursor: pointer;
  }
  .day > * + * { margin-top: 0.1rem; }
  .day.is-outside { visibility: hidden; }
  .night-cal.is-suspended .day.is-outside { visibility: visible; }
  .night-cal.is-suspended .day.is-outside > * { visibility: hidden; }
  .night-cal.is-suspended .day { color: var(--sheet); height: auto; }
  .night-cal.is-suspended .slot {
    border-right: 1px solid var(--wire); border-bottom: 1px solid var(--wire);
    box-shadow: 1px 0 6px rgba(62, 224, 255, 0.3), 0 1px 6px rgba(62, 224, 255, 0.2);
  }
  .night-cal.is-suspended .slot:nth-child(7n+1) { border-left: 1px solid var(--wire); }
  .night-cal.is-suspended .cells .slot:nth-child(-n+7) { border-top: 1px solid var(--wire); }
  .day.is-selected { border-bottom-color: var(--bulb); }
  .slot.is-open > .day {
    position: absolute; z-index: 1; left: 50%; top: 50%;
    width: calc(100% * var(--open)); height: auto;
    min-height: calc(var(--day) * var(--open));
    transform: translate(-50%, -50%); transform-style: preserve-3d;
    border-bottom-color: var(--bulb); background: var(--sheet);
    pointer-events: none; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .slot.is-opening > .day { animation: hole-open 360ms cubic-bezier(.16,.84,.28,1); }
  .slot.is-open > .day a, .slot.is-open > .day button.thumb { pointer-events: auto; }
  .night-cal.is-suspended .slot.is-open > .day {
    background: var(--night); border: 1px solid var(--wire);
    border-bottom: 2px solid var(--bulb);
    box-shadow: 0 0 10px rgba(62,224,255,0.35), 0 0 14px rgba(255,193,77,0.2);
  }
  @keyframes hole-open { from { clip-path: inset(46% 46% 46% 46%); } to { clip-path: inset(0); } }
  .day .num { font-family: var(--display); font-size: 1.3rem; line-height: 1; font-weight: 500; display: inline-block; }
  .day.is-today .num { box-shadow: inset 0 -2px 0 var(--ink); }
  .night-cal.is-suspended .day.is-today .num { box-shadow: inset 0 -2px 0 var(--bulb); }
  .night-cal.is-suspended a.gig-name, .night-cal.is-suspended button.thumb { color: var(--sheet); }
  .night-cal.is-suspended .gig.comedy .gig-name { color: var(--comedy-on-night); }
  .night-cal.is-suspended .gig-score.is-down, .night-cal.is-suspended .tally.is-down { color: var(--quiet-on-night); }
  .night-cal.is-suspended .bar { background: rgba(215,227,228,0.12); }
  .night-cal.is-suspended .bar-fill.is-up { background: var(--sheet); box-shadow: 0 0 6px rgba(215,227,228,0.25); }
  .night-cal.is-suspended .bar-fill.is-down { background: var(--quiet-on-night); }

  /* Gig rows — bigger, more readable */
  .gig {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 0.3rem; row-gap: 0.08rem; align-items: baseline;
    min-width: 0; max-width: 100%; font-size: 0.72rem; line-height: 1.15;
    --share: var(--share-rest, 0); --z: calc(var(--share, 0) * var(--depth) * 1px);
    transform: translateZ(var(--z)); transform-origin: 0 0;
  }
  .slot.is-open .gig { --share: var(--share-full, var(--share-rest, 0)); }
  .gig.is-extra { display: none; }
  .slot.is-open .gig.is-extra { display: grid; }
  .slot.is-open > .day {
    min-height: max(calc(var(--day) * var(--open)), calc(var(--lanes, 1) * 3.8rem + 2rem));
  }
  .slot.is-open > .day::before, .slot.is-open > .day::after {
    content: ""; position: absolute; background: var(--wire); pointer-events: none;
    box-shadow: 0 0 6px rgba(62, 224, 255, 0.35);
  }
  .slot.is-open > .day::before { left: 0.35rem; right: 0.45rem; bottom: 0.35rem; height: 1px; }
  .slot.is-open > .day::after { left: 0.35rem; top: 1.6rem; bottom: 0.35rem; width: 1px; }
  .slot.is-open .num { position: absolute; top: 0.2rem; left: 0.35rem; z-index: 8; }
  .slot.is-open .gig {
    position: absolute; left: calc(0.4rem + var(--x, 0) * 32%);
    top: calc(1.8rem + var(--y, 0) * (100% - 2.6rem));
    width: min(94%, calc(100% - 0.6rem)); max-width: calc(100% - 0.4rem - (0.4rem + var(--x, 0) * 32%));
    z-index: calc(3 + max(0, var(--share, 0)) * 5);
    --z: calc((clamp(-1, var(--share, 0), 1) * 0.45 + 0.55) * var(--depth) * 2.2px);
  }
  .slot.is-open .gig-name { grid-column: 1 / -1; grid-row: 1; font-size: 0.78rem; font-weight: 500; }
  .slot.is-open .gig-score, .slot.is-open .gig-actions { grid-column: 2; grid-row: 2; align-self: center; justify-self: end; }
  .meta { display: none; }
  .slot.is-open .meta { display: block; grid-column: 1; grid-row: 2; color: var(--quiet-on-night); font-size: 0.62rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filament { display: none; }
  .slot.is-open .filament {
    display: block; grid-column: 1 / -1; height: 1.5px;
    width: calc(var(--len, 0.08) * 100cqi); max-width: calc((1 - var(--x, 0)) * 92cqi);
    background: var(--ink); box-shadow: 0 0 4px rgba(23,35,38,0.2);
  }
  .night-cal.is-suspended .slot.is-open .filament { background: var(--wire); box-shadow: 0 0 6px rgba(62,224,255,0.6); }
  .slot.is-open .gig.comedy .filament { background: var(--comedy); }
  .night-cal.is-suspended .slot.is-open .gig.comedy .filament { background: var(--comedy-on-night); box-shadow: 0 0 6px rgba(240,160,154,0.6); }
  .gig-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.72rem; }
  a.gig-name { color: var(--ink); text-decoration: none; }
  a.gig-name:hover { text-decoration: underline; }
  .checks { grid-column: 1 / -1; display: none; }
  a.check { color: var(--ink); margin-right: 0.4rem; font-size: 0.68rem; text-decoration: none; }
  a.check:hover { text-decoration: underline; }
  .night-cal.is-suspended a.check { color: var(--wire); }
  .gig-score, .tally { font-family: var(--display); font-size: 0.85rem; line-height: 1; }
  .gig-score.is-down, .tally.is-down { color: var(--quiet); }
  .gig-actions { display: none; align-items: baseline; gap: 0.3rem; }
  .slot.is-open .gig-actions { display: flex; }
  .slot.is-open .gig-score { display: none; }
  .gig.comedy .gig-name { color: var(--comedy); }
  .bar { grid-column: 1 / -1; display: block; height: 2px; max-width: 100%; background: rgba(23,35,38,0.08); }
  .slot.is-open .bar { display: none; }
  .slot.is-open .more { display: none; }
  .bar-fill { display: block; height: 100%; width: 0; }
  .bar-fill.is-up { background: var(--ink); box-shadow: 0 0 4px rgba(23,35,38,0.2); }
  .bar-fill.is-down { background: var(--quiet); }
  .day .more { font-size: 0.68rem; color: var(--quiet); }
  button.thumb {
    color: var(--ink); border-bottom: 1.5px solid transparent; min-height: 0;
    font-size: 0.72rem; padding: 0.1rem 0; font-family: var(--text); font-weight: 500;
  }
  button.thumb:hover { border-bottom-color: var(--ink); }
  .empty { max-width: 28ch; margin: 0; font-size: 0.9rem; color: var(--quiet); }

  /* Closed note — quieter */
  .closed-note { font-size: 0.82rem; color: var(--quiet-on-night); margin: 0; padding: 0.15rem 0; }

  /* Footer — minimal */
  .footer { margin: 0.6rem 0 0; color: var(--quiet-on-night); font-size: 0.78rem; max-width: 44ch; line-height: 1.4; }

  /* Focus */
  button:focus-visible, a:focus-visible { outline: 2px solid var(--bulb); outline-offset: 2px; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .board { perspective: none; }
    .night-cal { --tilt: 0; --depth: 0; transform: none; }
    .day { perspective: none; }
    .slot.is-opening > .day { animation: none; }
    .gig { transform: none !important; }
    * { scroll-behavior: auto; }
  }

  /* Responsive */
  @media (max-width: 860px) {
    .board { perspective: 1000px; padding-bottom: 2rem; }
    .night-cal { width: 100%; --tilt: calc(var(--tilt-pref, 18) * 0.5); --depth: calc(var(--depth-pref, 12) * 0.55); }
    .day { perspective: 1400px; }
    .rail { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.4rem; }
    button.room { flex: 0 0 auto; }
    .night-cal { --day: 4.8rem; }
    .day { padding: 0.2rem 0.15rem 0.25rem; }
    .day .num, .day.is-selected .num { font-size: 1rem; }
    .gig { font-size: 0.64rem; }
    .bar { height: 1.5px; }
    .slot.is-open > .day {
      width: calc(100vw - 1.4rem); min-height: max(calc(var(--day) * var(--open)), calc(var(--lanes, 1) * 2.8rem + 1.4rem));
      left: calc(0.7rem - var(--inset, 0px)); transform: translate(0, -50%);
    }
    .slot.is-open .meta { font-size: 0.58rem; }
    .month { font-size: clamp(2rem, 10vw, 3rem); }
  }

  /* AVR / high-DPI / large-screen: bigger defaults */
  @media (min-width: 1400px) {
    .night-cal { --day: 8rem; }
    .gig { font-size: 0.8rem; }
    .gig-name { font-size: 0.78rem; }
    .day .num { font-size: 1.6rem; }
  }

  /* Simple utility for screen-reader-only text */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the calendar</a>
<div id="app"><p class="boot" style="padding:4rem 0;font-family:var(--display);font-size:2rem;">Opening the calendar…</p></div>
<script>
const NIGHT_KINDS = new Set(["music","comedy","show","trivia"]);
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function parts(path) {
  if (!path || path === "/") return [];
  return path.split("/").slice(1).map(p => p.replace(/~1/g,"/").replace(/~0/g,"~"));
}
function getPath(obj, path) {
  let cur = obj; for (const p of parts(path)) { if (cur == null) return undefined; cur = cur[p]; } return cur;
}
function setPath(obj, path, value) {
  const keys = parts(path); if (!keys.length) return value;
  const root = obj && typeof obj === "object" ? obj : {}; let cur = root;
  for (let i = 0; i < keys.length - 1; i++) { if (cur[keys[i]] == null || typeof cur[keys[i]] !== "object") cur[keys[i]] = {}; cur = cur[keys[i]]; }
  cur[keys[keys.length - 1]] = value; return root;
}
function dyn(data, value) {
  if (value == null) return "";
  if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") return value;
  if (typeof value === "object" && typeof value.path === "string") return getPath(data, value.path);
  return value;
}

class Processor {
  constructor() { this.surface = null; }
  apply(msg) {
    if (!msg || typeof msg !== "object") return;
    if (msg.createSurface) {
      const c = msg.createSurface;
      if (this.surface && this.surface.id === c.surfaceId) { this.surface.catalogId = c.catalogId; this.surface.theme = c.theme || this.surface.theme; return; }
      this.surface = { id: c.surfaceId, catalogId: c.catalogId, theme: c.theme || {}, components: new Map(), data: {} };
    } else if (msg.updateComponents && this.surface) {
      for (const comp of msg.updateComponents.components || []) this.surface.components.set(comp.id, comp);
    } else if (msg.updateDataModel && this.surface) {
      this.surface.data = setPath(this.surface.data, msg.updateDataModel.path, msg.updateDataModel.value);
    } else if (msg.deleteSurface && this.surface && this.surface.id === msg.deleteSurface.surfaceId) { this.surface = null; }
  }
  applyStream(text) { for (const line of text.split("\n")) { const t = line.trim(); if (t) this.apply(JSON.parse(t)); } }
}

const processor = new Processor();
const app = document.getElementById("app");
let busy = false;
let selectGen = 0, selectTimer = 0, lastTouch = 0, touchStart = null;
const lens = { date: null, sticky: false, chosen: null };

function calendarStamp(data) {
  if (!data || !data.ui) return "";
  const ui = data.ui;
  const rows = (data.events || []).map(e => [e.id, e.score, e.suppressed, e.title, e.date, e.venueId].join(":")).join("|");
  return [ui.month, ui.venueId, ui.scope, ui.showCount, ui.status, ui.closedNote, ui.depthNote, JSON.stringify(ui.view || {}), rows].join("~");
}

function themeVars(theme) {
  const root = document.documentElement;
  if (theme.background) root.style.setProperty("--night", theme.background);
  if (theme.foreground) root.style.setProperty("--sheet", theme.foreground);
  if (theme.sheet) root.style.setProperty("--sheet", theme.sheet);
  if (theme.ink) root.style.setProperty("--ink", theme.ink);
  if (theme.primaryColor) root.style.setProperty("--bulb", theme.primaryColor);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function shownEvents(data) {
  const venue = (data.ui && data.ui.venueId) || "";
  const scope = (data.ui && data.ui.scope) || "nights";
  return (data.events || []).filter(e => { if (venue && e.venueId !== venue) return false; if (scope === "nights" && !NIGHT_KINDS.has(e.kind)) return false; return true; });
}

function send(action, extra, gen) {
  if (!action || !action.event) return;
  const name = action.event.name;
  const context = Object.assign({}, action.event.context || {}, extra || {});
  const refresh = name === "refresh";
  if (refresh) { busy = true; render(); }
  fetch(refresh ? "/api/refresh" : "/api/action", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name, context}) })
    .then(r => { if (!r.ok) throw new Error("The calendar could not update."); return r.json(); })
    .then(message => {
      if (gen != null && gen !== selectGen) return;
      const before = calendarStamp(processor.surface && processor.surface.data);
      processor.apply(message);
      const quiet = gen != null && calendarStamp(processor.surface.data) === before;
      if (quiet) { const ui = processor.surface.data.ui || {}; if (!lens.chosen || lens.chosen === ui.selectedDate) markSelected(ui.selectedDate); applyLens(); return; }
      if (name !== "selectDate" && name !== "vote") { lens.chosen = null; lens.date = null; lens.sticky = false; }
      render();
    }).catch(err => { const data = processor.surface && processor.surface.data; if (data && data.ui) data.ui.status = err.message || "The calendar could not update."; render(); })
    .finally(() => { busy = false; });
}

function renderText(component, data) {
  const text = dyn(data, component.text);
  if (text == null || text === "") return null;
  const node = el("p", component.variant === "caption" ? "footer" : "", String(text));
  return node;
}

function renderButton(component, surface) {
  const label = surface.components.get(component.child);
  const text = label ? dyn(surface.data, label.text) : component.child;
  const button = el("button", "ctrl", String(text || ""));
  button.type = "button";
  const variant = dyn(surface.data, component.variant);
  if (variant === "primary") button.classList.add("is-primary");
  if (busy && component.action && component.action.event && component.action.event.name === "refresh") { button.setAttribute("aria-busy","true"); button.disabled = true; }
  button.addEventListener("click", () => send(component.action));
  return button;
}

function renderMarquee(component, data) {
  const wrap = el("header", "marquee");
  const place = dyn(data, component.place);
  if (place) wrap.append(el("p", "place", String(place)));
  wrap.append(el("h1", "month", String(dyn(data, component.month) || "")));
  const count = dyn(data, component.count);
  if (count) wrap.append(el("p", "count", String(count)));
  const status = dyn(data, component.status);
  if (status) wrap.append(el("p", "status", String(status)));
  return wrap;
}

function renderRail(component, data) {
  const venues = dyn(data, component.venues) || [];
  const selected = String(dyn(data, component.selected) || "");
  const rail = el("nav", "rail"); rail.setAttribute("aria-label", "Rooms");
  const all = el("button", "room" + (selected ? "" : " is-on"), "Every room"); all.type = "button";
  all.addEventListener("click", () => { if (selected) send(component.action, {venueId: selected}); });
  rail.append(all);
  for (const venue of venues) {
    const btn = el("button", "room" + (venue.id === selected ? " is-on" : ""), venue.name); btn.type = "button";
    if (venue.music) { btn.dataset.music = "true"; btn.setAttribute("aria-label", venue.name + ", music room"); }
    btn.addEventListener("click", () => send(component.action, {venueId: venue.id}));
    rail.append(btn);
  }
  const wrap = el("div", "room-block"); wrap.append(rail);
  const chosen = venues.find(v => v.id === selected);
  const line = contactLine(chosen);
  if (line) wrap.append(line);
  return wrap;
}

function contactLine(venue) {
  const contact = venue && venue.contact; if (!contact) return null;
  const bits = [];
  for (const phone of contact.phones || []) { if (phone.href) bits.push({href: phone.href, text: phone.text}); else if (phone.text) bits.push({text: phone.text}); }
  for (const mail of contact.emails || []) { if (mail.href) bits.push({href: mail.href, text: mail.text}); }
  for (const site of contact.websites || []) { if (site.href) bits.push({href: site.href, text: site.text}); }
  for (const social of contact.socials || []) { if (social.href) bits.push({href: social.href, text: social.text}); }
  if (!bits.length) return null;
  const line = el("p", "contact"); line.append(document.createTextNode(venue.name));
  for (const bit of bits) {
    line.append(document.createTextNode(" · "));
    if (bit.href && /^(https:|tel:|mailto:)/.test(bit.href)) {
      const link = el("a", "", bit.text); link.href = bit.href;
      if (bit.href.startsWith("https:")) { link.rel = "noreferrer"; link.target = "_blank"; }
      line.append(link);
    } else { line.append(document.createTextNode(bit.text)); }
  }
  return line;
}

function monthGrid(monthKey) {
  const [year, month] = monthKey.split("-").map(Number);
  const first = new Date(year, month - 1, 1); const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = []; for (let i = 0; i < 42; i++) { const day = new Date(start); day.setDate(start.getDate() + i); cells.push(day); if (i > 27 && day.getDay() === 6 && day.getMonth() !== month - 1) break; }
  return { year, month, cells };
}

function monthPeak(events, monthKey) {
  let peak = 0; for (const event of events) { if (!event.date || !String(event.date).startsWith(monthKey)) continue; peak = Math.max(peak, Math.abs(Number(event.score) || 0)); } return peak;
}

function readView(raw) {
  const source = raw && typeof raw === "object" ? raw : {};
  const num = (v, fb, lo, hi) => { const n = Number(v); if (!Number.isFinite(n)) return fb; return Math.min(hi, Math.max(lo, n)); };
  const flag = (v, fb) => { if (v == null) return fb; if (typeof v === "string") return !/^(0|false|no|off)$/i.test(v.trim()); return Boolean(v); };
  return { tilt: num(source.tilt, 18, 0, 24), depth: num(source.depth, 12, 0, 24), bars: flag(source.bars, true), focus: num(source.focus, 1.15, 1, 1.6), suspended: flag(source.suspended, true) };
}

const NIGHT_FROM = 11 * 60, NIGHT_SPAN = 15 * 60;
function clockMinutes(label) { const m = /^(\d{1,2}):(\d{2})\s*(am|pm)$/i.exec(String(label || "").trim()); if (!m) return null; let h = Number(m[1]) % 12; if (m[3].toLowerCase() === "pm") h += 12; return h * 60 + Number(m[2]); }
function nightMinutes(minutes) { let v = Number(minutes); if (!Number.isFinite(v)) return NIGHT_FROM; if (v < 5 * 60) v += 24 * 60; return v; }

function placeNight(gigs) {
  const rooms = []; for (const gig of gigs) { const r = gig.venue || ""; if (!rooms.includes(r)) rooms.push(r); }
  const laneOf = new Map(); let next = 0; for (const room of rooms) { for (const gig of gigs) { if ((gig.venue || "") !== room) continue; laneOf.set(gig, next); next += 1; } }
  const total = Math.max(next, 1); const spots = gigs.map(gig => { const start = nightMinutes(gig.minutes); const clock = clockMinutes(gig.endLabel); let end = clock == null ? start + 45 : nightMinutes(clock); if (end <= start) end = start + 45; const x = Math.min(1, Math.max(0, (start - NIGHT_FROM) / NIGHT_SPAN)); const len = Math.min(1, Math.max(0.06, (end - start) / NIGHT_SPAN)); const y = (laneOf.get(gig) || 0) / total; return { x, y, len }; });
  return { rooms: total, spots };
}

function renderGig(gig, peak, voteAction, view) {
  const score = Number(gig.score) || 0;
  const line = el("span", "gig" + (gig.kind === "comedy" ? " comedy" : ""));
  const share = peak > 0 ? score / peak : 0;
  line.style.setProperty("--share-full", share.toFixed(4));
  line.style.setProperty("--share-rest", (share * 0.5).toFixed(4));
  if (gig.sourceUrl && /^https:\/\//.test(gig.sourceUrl)) { const link = el("a", "gig-name", gig.title); link.href = gig.sourceUrl; link.rel = "noreferrer"; link.target = "_blank"; line.append(link); }
  else { line.append(el("span", "gig-name", gig.title)); }
  const meta = el("span", "meta"); const bits = []; if (gig.venue) bits.push(gig.venue); if (gig.startLabel) bits.push(gig.startLabel); if (bits.length) meta.textContent = bits.join(", "); line.append(meta);
  const filament = el("span", "filament"); filament.setAttribute("aria-hidden","true"); line.append(filament);
  if (Array.isArray(gig.checks) && gig.checks.length) { const extra = el("span", "checks"); for (const c of gig.checks) { if (!c || !c.url || !/^https:\/\//.test(c.url)) continue; const link = el("a", "check", c.name || "Source"); link.href = c.url; link.rel = "noreferrer"; link.target = "_blank"; extra.append(link); } if (extra.childNodes.length) line.append(extra); }
  if (score) { const mark = score > 0 ? "+" + score : String(score); line.append(el("span", "gig-score" + (score < 0 ? " is-down" : ""), mark)); }
  if (voteAction) line.append(renderVotes(gig, voteAction));
  if (view.bars) { const shareAbs = Math.abs(share); const bar = el("span", "bar"); bar.setAttribute("role","img"); const against = peak > 0 ? ", against a strongest night of " + peak : ""; bar.setAttribute("aria-label", (score > 0 ? "+" : "") + score + against); const fill = el("span", "bar-fill" + (score < 0 ? " is-down" : score > 0 ? " is-up" : "")); fill.style.width = (shareAbs * 100).toFixed(1) + "%"; bar.append(fill); line.append(bar); }
  return line;
}

function renderCalendar(component, surface) {
  const data = surface.data; const monthKey = String(dyn(data, component.month) || ""); const selected = String(dyn(data, component.selectedDate) || "");
  const events = shownEvents(data); const byDate = new Map(); for (const e of events) { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); }
  const sheet = el("section", "sheet night-cal"); sheet.setAttribute("aria-label", "Month");
  if (!/^\d{4}-\d{2}$/.test(monthKey)) { sheet.append(el("p", "empty", "No month to show.")); return sheet; }
  const view = readView(dyn(data, component.view)); const peak = monthPeak(events, monthKey);
  sheet.dataset.peak = String(peak); sheet.dataset.tilt = String(view.tilt); sheet.dataset.depth = String(view.depth); sheet.dataset.focus = String(view.focus); sheet.dataset.bars = view.bars ? "true" : "false"; sheet.dataset.suspended = view.suspended ? "true" : "false"; sheet.classList.toggle("is-suspended", view.suspended);
  sheet.style.setProperty("--tilt-pref", String(view.tilt)); sheet.style.setProperty("--depth-pref", String(view.depth)); sheet.style.setProperty("--focus-pref", String(view.focus));
  const grid = monthGrid(monthKey); const head = el("div", "dow"); for (const n of DOW) head.append(el("span", "", n)); const cells = el("div", "cells");
  const today = new Date(); const todayKey = [today.getFullYear(), String(today.getMonth()+1).padStart(2,"0"), String(today.getDate()).padStart(2,"0")].join("-");
  for (const day of grid.cells) {
    const key = [day.getFullYear(), String(day.getMonth()+1).padStart(2,"0"), String(day.getDate()).padStart(2,"0")].join("-");
    const outside = day.getMonth() !== grid.month - 1; const focused = key === selected && !outside; const node = el("button", "day" + (focused ? " is-selected" : "")); node.type = "button"; node.dataset.date = key;
    if (outside) node.classList.add("is-outside"); if (key === todayKey) node.classList.add("is-today");
    node.append(el("span", "num", String(day.getDate())));
    const gigs = (byDate.get(key) || []).slice().sort((a,b) => (a.minutes||0) - (b.minutes||0)); if (gigs.length) node.classList.add("has-shows");
    const placed = placeNight(gigs); node.style.setProperty("--lanes", String(placed.rooms));
    const labelBits = [day.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"})];
    gigs.forEach((gig, idx) => { const score = Number(gig.score) || 0; const line = renderGig(gig, peak, component.vote, view); const spot = placed.spots[idx]; line.style.setProperty("--x", spot.x.toFixed(4)); line.style.setProperty("--y", spot.y.toFixed(4)); line.style.setProperty("--len", spot.len.toFixed(4)); if (idx >= 2) line.classList.add("is-extra"); node.append(line); const mark = score > 0 ? "+" + score : String(score); labelBits.push(score ? gig.title + " " + mark : gig.title); });
    if (gigs.length > 2) node.append(el("span", "more", (gigs.length - 2) + " more"));
    node.setAttribute("aria-label", labelBits.join(", ")); if (focused) node.setAttribute("aria-current","date"); else if (!outside) node.setAttribute("aria-pressed","false");
    if (!outside) { node.addEventListener("click", (ev) => { if (ev.detail === 0) setOpen(key, {sticky:true, animate:true}); queueSelect(component.action, key); }); } else { node.tabIndex = -1; node.disabled = true; }
    const slot = el("div", "slot"); slot.dataset.date = key; slot.append(node); cells.append(slot);
  }
  sheet.append(head, cells); bindSheet(sheet, component); const board = el("div", "board"); board.append(sheet); return board;
}

function markSelected(date) { const sheet = app.querySelector(".night-cal"); if (!sheet) return; for (const d of sheet.querySelectorAll(".day")) { const on = d.dataset.date === date && !d.classList.contains("is-outside"); d.classList.toggle("is-selected", on); if (on) { d.setAttribute("aria-current","date"); d.removeAttribute("aria-pressed"); } else if (!d.classList.contains("is-outside")) { d.removeAttribute("aria-current"); d.setAttribute("aria-pressed","false"); } } }

function pinInset(sheet, slot, on) { if (!on) { slot.style.removeProperty("--inset"); return; } const sb = sheet.getBoundingClientRect(); const b = slot.getBoundingClientRect(); slot.style.setProperty("--inset", (b.left - sb.left).toFixed(1) + "px"); }
function setOpen(date, opts) { const sheet = app.querySelector(".night-cal"); if (!sheet) return; const sticky = Boolean(opts && opts.sticky); const same = date === lens.date; lens.sticky = sticky; if (same) return; const animate = Boolean(opts && opts.animate && date); lens.date = date; for (const slot of sheet.querySelectorAll(".slot")) { const on = Boolean(date) && slot.dataset.date === date; slot.classList.toggle("is-open", on); slot.classList.toggle("is-opening", on && animate); pinInset(sheet, slot, on); } }
function applyLens() { const sheet = app.querySelector(".night-cal"); if (!sheet) return; for (const slot of sheet.querySelectorAll(".slot")) { const on = Boolean(lens.date) && slot.dataset.date === lens.date; slot.classList.toggle("is-open", on); slot.classList.remove("is-opening"); pinInset(sheet, slot, on); } if (lens.chosen) markSelected(lens.chosen); }

function pointIn(box, x, y) { return x >= box.left && x < box.right && y >= box.top && y < box.bottom; }
function slotFromPoint(sheet, x, y) { let under = null; for (const slot of sheet.querySelectorAll(".slot")) { const day = slot.querySelector(".day"); if (!day || day.classList.contains("is-outside")) continue; if (pointIn(slot.getBoundingClientRect(), x, y)) { under = slot; break; } } if (under && !under.classList.contains("is-open")) return under; const open = sheet.querySelector(".slot.is-open"); if (open) { const day = open.querySelector(".day"); if (day && pointIn(day.getBoundingClientRect(), x, y)) return open; } return under; }
function queueSelect(action, date) { markSelected(date); if (lens.chosen === date) return; lens.chosen = date; clearTimeout(selectTimer); const gen = ++selectGen; selectTimer = setTimeout(() => { selectTimer = 0; const ui = processor.surface && processor.surface.data && processor.surface.data.ui; if (lens.chosen !== date) return; if (ui && ui.selectedDate === date) return; send(action, {date}, gen); }, 70); }

function bindSheet(sheet, component) {
  sheet.addEventListener("pointermove", (ev) => { if (ev.pointerType === "touch") return; if (Date.now() - lastTouch < 800) return; const slot = slotFromPoint(sheet, ev.clientX, ev.clientY); if (!slot) { if (!lens.sticky) setOpen(null, {sticky:false, animate:false}); return; } const date = slot.dataset.date; setOpen(date, {sticky:false, animate:true}); queueSelect(component.action, date); });
  sheet.addEventListener("pointerleave", () => { if (Date.now() - lastTouch < 800) return; if (!lens.sticky) setOpen(null, {sticky:false, animate:false}); });
  sheet.addEventListener("pointerdown", (ev) => { if (ev.pointerType !== "touch") return; lastTouch = Date.now(); touchStart = {x:ev.clientX, y:ev.clientY}; });
  sheet.addEventListener("pointerup", (ev) => { if (ev.pointerType !== "touch") return; lastTouch = Date.now(); const s = touchStart; touchStart = null; if (!s) return; if (Math.hypot(ev.clientX - s.x, ev.clientY - s.y) > 12) return; const slot = slotFromPoint(sheet, ev.clientX, ev.clientY); if (!slot) return; const date = slot.dataset.date; setOpen(date, {sticky:true, animate:true}); queueSelect(component.action, date); });
  sheet.addEventListener("keydown", (ev) => onCalendarKey(ev, component));
}

function onCalendarKey(event, component) { const arrows = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}; const ui = processor.surface && processor.surface.data && processor.surface.data.ui; const sel = lens.chosen || (ui && ui.selectedDate) || ""; if (!(event.key in arrows) || !/^\d{4}-\d{2}-\d{2}$/.test(sel)) return; if (event.target.closest("button.thumb, a")) return; event.preventDefault(); const [yr,mo,dy] = sel.split("-").map(Number); const nx = new Date(yr, mo-1, dy + arrows[event.key]); const key = [nx.getFullYear(), String(nx.getMonth()+1).padStart(2,"0"), String(nx.getDate()).padStart(2,"0")].join("-"); setOpen(key, {sticky:true, animate:true}); queueSelect(component.action, key); }

function renderVotes(event, action) {
  const row = el("span", "gig-actions"); const score = Number(event.score) || 0;
  const up = el("button", "thumb", "Up"); up.type = "button"; up.dataset.dir = "up"; up.dataset.eventId = event.id; up.setAttribute("aria-label", "Thumbs up for " + event.title); up.addEventListener("click", () => send(action, {eventId:event.id, direction:"up"}));
  const down = el("button", "thumb", "Down"); down.type = "button"; down.dataset.dir = "down"; down.dataset.eventId = event.id; down.setAttribute("aria-label", "Thumbs down for " + event.title); down.addEventListener("click", () => send(action, {eventId:event.id, direction:"down"}));
  const tally = el("span", "tally" + (score < 0 ? " is-down" : ""), score > 0 ? "+" + score : String(score)); tally.setAttribute("aria-label", (score > 0 ? "+" : "") + score + " so far");
  row.append(up, tally, down); return row;
}

function renderChildren(ids, surface, host) { for (const id of ids || []) { const child = renderComponent(surface, id); if (child) host.append(child); } }

function renderComponent(surface, id) {
  const component = surface.components.get(id); if (!component) return null; const data = surface.data;
  if (component.component === "Column" || component.component === "Row") { const node = el("div", component.component === "Row" ? "a2ui-row" : "a2ui-column"); renderChildren(component.children, surface, node); return node; }
  if (component.component === "Text") return renderText(component, data);
  if (component.component === "Button") return renderButton(component, surface);
  if (component.component === "Marquee") return renderMarquee(component, data);
  if (component.component === "VenueRail") return renderRail(component, data);
  if (component.component === "NightCalendar") return renderCalendar(component, surface);
  return el("p", "footer", "Unsupported component " + component.component);
}

function render() {
  const active = document.activeElement; const restore = !active ? null : active.classList.contains("day") ? {kind:"day"} : active.classList.contains("room") ? {kind:"room", name:active.textContent} : active.classList.contains("thumb") ? {kind:"thumb", dir:active.dataset.dir, eventId:active.dataset.eventId} : null;
  const surface = processor.surface; app.replaceChildren();
  if (!surface || !surface.components.has("root")) { app.append(el("p", "boot", "The calendar surface did not arrive.")); return; }
  themeVars(surface.theme || {}); const root = renderComponent(surface, "root"); if (root) app.append(root); applyLens(); if (!restore) return;
  if (restore.kind === "day") { const cur = app.querySelector(".day.is-selected"); if (cur) cur.focus(); } else if (restore.kind === "room") { for (const r of app.querySelectorAll("button.room")) { if (r.textContent === restore.name) r.focus(); } } else if (restore.kind === "thumb") { const t = app.querySelector("button.thumb[data-dir='"+restore.dir+"'][data-event-id='"+restore.eventId+"']"); if (t) t.focus(); }
}

function load() {
  fetch("/api/surface").then(r => { if (!r.ok) throw new Error("The calendar surface did not load."); return r.text(); })
    .then(text => { processor.applyStream(text); render(); })
    .catch(err => { app.replaceChildren(el("p", "boot", err.message || "The calendar surface did not load.")); });
}

document.addEventListener("pointerdown", (ev) => { if (!lens.sticky) return; const sheet = app.querySelector(".night-cal"); if (!sheet || sheet.contains(ev.target)) return; setOpen(null, {sticky:false, animate:false}); });

load();
setInterval(() => { if (busy || !processor.surface) return; fetch("/api/model").then(r => r.json()).then(message => { const before = JSON.stringify(processor.surface.data.events || []); processor.apply(message); const after = JSON.stringify(processor.surface.data.events || []); if (before !== after) render(); }).catch(() => {}); }, 45000);
</script>
